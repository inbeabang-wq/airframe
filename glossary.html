  document.getElementById('list').innerHTML=out;
  document.getElementById('count').textContent=rows.length.toLocaleString()+'개';
  document.getElementById('noresult').style.display=rows.length?'none':'block';
}
function doSearch(){
  var v=(document.getElementById('q').value||'').trim().toLowerCase();
  render(DATA.filter(function(d){
    if(KIND && d.k!==KIND) return false;
    if(!v) return true;
    if(d.ko.toLowerCase().indexOf(v)>=0) return true;
    if(d.en.join(' ').toLowerCase().indexOf(v)>=0) return true;
    return d.s.some(function(s){return s.t.toLowerCase().indexOf(v)>=0;});
  }));
}
function setK(k){
  KIND=k;
  ['all','용어','도면'].forEach(function(x){
    var b=document.getElementById('f-'+x); if(b) b.classList.toggle('on', (k===''&&x==='all')||k===x);
  });
  doSearch();
}
function jump(i){var e=document.getElementById('g'+i); if(e) e.scrollIntoView({behavior:'smooth'});}
doSearch();
</script></body></html>
