var list = document.getElementById('list');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function render(q){
  q = (q||'').trim().toLowerCase();
  list.innerHTML=''; var shown=0;
  DATA.forEach(function(ch){
    var hits = ch.topics.filter(function(t){
      return !q || (t.ko+' '+t.en).toLowerCase().indexOf(q)>=0;
    });
    if(!hits.length) return;
    shown += hits.length;
    var b = document.createElement('div'); b.className='chblock';
    var h = '<div class="chhead"><div><a href="'+ch.file+'">Ch.'+ch.no+' '+ch.ko+'</a>'
      + '<span class="en">'+esc(ch.en)+'</span></div>'
      + '<span class="meta">주제 '+hits.length+' · 구술 '+ch.oral+' · 기출 '+ch.quiz+'</span></div><div class="tgrid">';
    hits.forEach(function(t){
      h += '<a class="topic" href="'+ch.file+'#'+t.id+'">'+t.ko+'<span class="en">'+esc(t.en)+'</span></a>';
    });
    h += '</div>';
    b.innerHTML = h; list.appendChild(b);
  });
  document.getElementById('count').textContent = '주제 '+shown+'개' + (q?' (검색: '+q+')':'');
  document.getElementById('noresult').style.display = shown?'none':'block';
}
function doSearch(v){render(v);}
render('');
